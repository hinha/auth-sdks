name: Rust unit tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (pinned by rust/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - auth-sdks-obs
          - auth-sdks-stdlog
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (pinned by rust/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test with coverage gate (≥80%, same floor as go-test-cover.sh)
        run: cargo llvm-cov --package ${{ matrix.crate }} --locked --fail-under-lines 80 --summary-only
